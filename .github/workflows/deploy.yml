name: Deploy to Home Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even without changes'
        required: false
        default: 'false'

jobs:
  deploy:
    name: Deploy to Self-Hosted Server
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create data directory
        run: |
          mkdir -p ./data
          chmod 755 ./data

      # CRITICAL: Create .env file from GitHub Secrets
      - name: Create .env file from secrets
        run: |
          echo "# Auto-generated by GitHub Actions - DO NOT COMMIT" > .env
          echo "# Generated at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> .env
          echo "" >> .env
          echo "# Telegram Bot Configuration" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "" >> .env
          echo "# Optional Configuration" >> .env
          echo "DEFAULT_TIMEZONE=${{ secrets.DEFAULT_TIMEZONE || 'UTC' }}" >> .env
          echo "NOMINATIM_USER_AGENT=${{ secrets.NOMINATIM_USER_AGENT || 'reminder-bot' }}" >> .env
          echo "DATABASE_URL=sqlite+aiosqlite:///data/reminders.db" >> .env
          echo "LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}" >> .env

          # Verify .env file was created and is not empty
          if [ ! -s .env ]; then
            echo "ERROR: .env file is empty or was not created"
            exit 1
          fi

          # Check if TELEGRAM_BOT_TOKEN is set
          if ! grep -q "TELEGRAM_BOT_TOKEN=" .env || grep -q "TELEGRAM_BOT_TOKEN=$" .env; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is not set in GitHub Secrets"
            echo "Please add TELEGRAM_BOT_TOKEN to your repository secrets"
            exit 1
          fi

          echo "✓ .env file created successfully"

      - name: Backup existing database
        run: |
          if [ -f ./data/reminders.db ]; then
            mkdir -p ./backups
            BACKUP_FILE="./backups/reminders_$(date +%Y%m%d_%H%M%S).db"
            cp ./data/reminders.db "$BACKUP_FILE"
            echo "✓ Database backed up to: $BACKUP_FILE"

            # Keep only last 10 backups
            ls -t ./backups/reminders_*.db | tail -n +11 | xargs -r rm
            echo "✓ Old backups cleaned up (keeping last 10)"
          else
            echo "ℹ No existing database to backup"
          fi

      - name: Stop and remove old container
        run: |
          if [ $(docker ps -q -f name=telegram-reminder-bot) ]; then
            echo "Stopping existing container..."
            docker stop telegram-reminder-bot
            docker rm telegram-reminder-bot
            echo "✓ Old container removed"
          else
            echo "ℹ No existing container to remove"
          fi

      - name: Remove old images (keep last 3)
        run: |
          # Remove old images except the last 3
          OLD_IMAGES=$(docker images telegram-reminder-bot --format "{{.ID}}" | tail -n +4)
          if [ ! -z "$OLD_IMAGES" ]; then
            echo "Removing old images..."
            echo "$OLD_IMAGES" | xargs docker rmi -f || true
            echo "✓ Old images cleaned up"
          else
            echo "ℹ No old images to remove"
          fi

      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t telegram-reminder-bot:${{ github.sha }} .
          docker tag telegram-reminder-bot:${{ github.sha }} telegram-reminder-bot:latest
          echo "✓ Image built: telegram-reminder-bot:${{ github.sha }}"

      - name: Run new container
        run: |
          echo "Starting new container..."
          docker run -d \
            --name telegram-reminder-bot \
            --restart unless-stopped \
            --env-file ./.env \
            -v $(pwd)/data:/data \
            telegram-reminder-bot:${{ github.sha }}
          echo "✓ Container started successfully"

      - name: Wait for container to be healthy
        run: |
          echo "Waiting for container to become healthy..."
          TIMEOUT=60
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(docker inspect --format='{{.State.Status}}' telegram-reminder-bot 2>/dev/null || echo "not_found")

            if [ "$STATUS" = "running" ]; then
              echo "✓ Container is running"
              break
            elif [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
              echo "ERROR: Container failed to start"
              docker logs telegram-reminder-bot
              exit 1
            fi

            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "ERROR: Container health check timeout"
            docker logs telegram-reminder-bot
            exit 1
          fi

      - name: Verify bot is working
        run: |
          echo "Verifying bot is responding..."
          sleep 10

          # Check if container is still running
          if [ $(docker ps -q -f name=telegram-reminder-bot) ]; then
            echo "✓ Bot container is running"

            # Show last 20 lines of logs
            echo ""
            echo "Recent logs:"
            docker logs --tail=20 telegram-reminder-bot
          else
            echo "ERROR: Bot container stopped unexpectedly"
            docker logs telegram-reminder-bot
            exit 1
          fi

      # CRITICAL SECURITY: Remove .env file
      - name: Remove .env file
        if: always()
        run: |
          if [ -f .env ]; then
            shred -uvz .env 2>/dev/null || rm -f .env
            echo "✓ .env file securely removed"
          fi

      - name: Display deployment summary
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "✓ Deployment Successful"
          echo "=========================================="
          echo ""
          echo "Container:  telegram-reminder-bot"
          echo "Image:      telegram-reminder-bot:${{ github.sha }}"
          echo "Status:     Running"
          echo ""
          echo "Commands:"
          echo "  View logs:    docker logs -f telegram-reminder-bot"
          echo "  Check status: docker ps -f name=telegram-reminder-bot"
          echo "  Stop bot:     docker stop telegram-reminder-bot"
          echo ""

      - name: Cleanup on failure
        if: failure()
        run: |
          echo "Deployment failed - cleaning up..."

          # Remove .env file if it still exists
          if [ -f .env ]; then
            shred -uvz .env 2>/dev/null || rm -f .env
          fi

          # Show container logs for debugging
          if [ $(docker ps -aq -f name=telegram-reminder-bot) ]; then
            echo ""
            echo "Container logs:"
            docker logs telegram-reminder-bot
          fi

      - name: Send deployment notification (optional)
        if: success()
        run: |
          echo "Deployment completed at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          # You can add notification logic here (e.g., send a message to Telegram)
